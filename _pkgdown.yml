url: https://adrientaudiere.github.io/phylopq/
template:
  bootstrap: 5
  bslib:
    bg: "#c5d8b0"
    fg: "#0a1810"
    primary: "#117743"
    secondary: "#a36100"
    base_font: "Fira Mono, monospace"
    heading_font: "Fira Sans, sans-serif"
    code_font: "Fira Code, monospace"

reference:
  - title: "Phylogenetic analysis for phyloseq"
    desc: >
      Functions for tree construction, phylogenetic distances and
      phylogeny-aware visualisations of 'phyloseq' objects.
