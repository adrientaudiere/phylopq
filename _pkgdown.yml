url: https://adrientaudiere.github.io/phylopq/
template:
  bootstrap: 5
  bslib:
    bg: "#c5d8b0"
    fg: "#0a1810"
    primary: "#117743"
    secondary: "#a36100"
    base_font: "Fira Mono, monospace"
    heading_font: "Fira Sans, sans-serif"
    code_font: "Fira Code, monospace"

reference:
  - title: "Trees"
    desc: >
      Build a tree from the taxonomy, attach it to a 'phyloseq' object and
      agglomerate taxa along it.
    contents:
      - add_tree_pq
      - phylo_glom_pq
      - phylo_glom_scan_pq
      - taxo2tree

  - title: "Species delimitation and clustering"
    desc: >
      Regroup taxa by a barcode gap (ABGD, ASAP) or by a sequence-similarity
      network (NSC).
    contents:
      - delim_multi_pq
      - delim_pq
      - ssn_glom_pq
      - ssn_glom_scan_pq

  - title: "Phylogenetic placement"
    desc: >
      Place reference sequences on a fixed reference phylogeny with EPA-ng and
      turn the placement into a taxonomy with gappa.
    contents:
      - assign_placement_pq
      - place_pq
      - print.phylopq_refpkg
      - ref_package_pq

  - title: "External programs"
    desc: >
      Check for and install the command-line programs the functions above
      drive.
    contents:
      - install_abgd
      - install_asap
      - install_epang
      - install_gappa
      - is_delim_installed
      - is_epang_installed
      - is_gappa_installed

  - title: "Re-exported from MiscMetabar"
    desc: >
      Alignment helpers that live in MiscMetabar so that every pqverse package
      can reach them, and are re-exported here.
    contents:
      - reexports

navbar:
  structure:
    left:
      - home
      - intro
      - reference
      - articles
      - news
    right:
      - github
